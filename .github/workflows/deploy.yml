name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; let a running deploy finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Angular 22 needs Node >= 22.22.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate sounds.json against the audio files
        run: npm run validate:sounds

      # The base href is the repository name, so renaming the repo needs no change here.
      # The application builder writes the site into dist/site/browser.
      - name: Build
        run: >
          npx ng build
          --configuration production
          --output-path dist/site
          --base-href "/${{ github.event.repository.name }}/"

      # GitHub Pages has no SPA fallback: serve index.html for unknown routes.
      - name: Add SPA fallback
        run: cp dist/site/browser/index.html dist/site/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4