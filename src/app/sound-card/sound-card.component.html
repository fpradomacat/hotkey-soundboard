<div class="button-container" [class.playing]="isPlaying()">

  <button type="button"
          class="button-icon"
          [attr.aria-label]="'Reproducir ' + sound().displayName"
          [attr.aria-keyshortcuts]="sound().ariaKeyShortcuts"
          (click)="play()">
    <span aria-hidden="true">PLAY</span>
  </button>

  <div class="button-text">
    <span [title]="sound().displayName">{{ sound().displayName }}</span>
  </div>

  @if (sound().hasHotkey) {
    <div class="shortcut"
         aria-hidden="true"
         [title]="'Shortcut: ' + sound().hotkeyToString">
      <div>{{ sound().hotkey.isCtrlPressed ? 'CTRL' : '' }}</div>
      <div>{{ sound().hotkey.key.toUpperCase() }}</div>
    </div>
  }
</div>
