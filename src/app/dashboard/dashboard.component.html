<div class="dashboard">

  <h1 class="sr-only">Botonera de sonidos</h1>

  <app-stop-button />

  <input type="text"
         name="filter"
         placeholder="Buscar..."
         aria-label="Buscar sonidos"
         autocomplete="off"
         maxlength="20"
         [value]="searchText()"
         (input)="onSearchInput($event)"
  >

  <p class="sr-only" aria-live="polite">{{ currentSound() ? 'Reproduciendo ' + currentSound()?.displayName : '' }}</p>

  @if (searchResults(); as results) {
    <app-sounds-section [section]="results" />
  } @else {
    @for (section of soundsLibraryService.soundSections; track section.getName()) {
      <app-sounds-section [section]="section" />
    }
  }

</div>
