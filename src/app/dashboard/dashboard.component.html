<div class="dashboard">

  <!--  <app-header></app-header>-->

  <app-stop-button></app-stop-button>

  <input #searchInput
    [ngModel]="searchText"
    (ngModelChange)="onSearchTextChange($event)"
    (focus)="isInputTextFocused = true"
    (blur)="isInputTextFocused = false"
    name="filter"
    placeholder="Buscar..."
    type="text"
    autocomplete="off"
    maxlength="20"
    >

    @if (searchResults) {
      <app-sounds-section [section]="searchResults"></app-sounds-section>
    } @else {
      @for (section of this.soundsLibraryService.soundSections; track section) {
        <app-sounds-section
        [section]="section"></app-sounds-section>
      }
    }


  </div>
