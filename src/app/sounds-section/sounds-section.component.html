<div class="sounds-section">
  <div class="section-header">
    <h3>{{this.section.getName()}}</h3>
  </div>
  <div class="sounds-container">
    @for (sound of this.section.getSounds(); track sound) {
      <app-sound-card
      [sound]="sound"></app-sound-card>
    }
  </div>

  @if (this.section.getSounds().length === 0) {
    <span
      class="no-data-label">
      No hay sonidos :(
    </span>
  }
</div>
