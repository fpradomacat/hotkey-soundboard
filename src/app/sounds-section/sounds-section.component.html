<section class="sounds-section" [attr.aria-label]="section().getName()">
  <div class="section-header">
    <h2>{{ section().getName() }}</h2>
  </div>
  <div class="sounds-container">
    @for (sound of section().getSounds(); track sound.source) {
      <app-sound-card [sound]="sound" />
    }
  </div>

  @if (section().getSounds().length === 0) {
    <span class="no-data-label" role="status">No hay sonidos :(</span>
  }
</section>
